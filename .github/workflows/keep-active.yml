name: Scheduled Repository Maintenance

on:
  schedule:
    # Runs once per day at 14:17 UTC (7:47 PM IST)
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-repository-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create random daily commits
        run: |
          git config user.name "yashsing0224234-max"
          git config user.email "232315740+yashsing0224234-max@users.noreply.github.com"

          mkdir -p .github

          COUNT=$((8 + RANDOM % 5))
          echo "Creating $COUNT commits today."

          for i in $(seq 1 "$COUNT"); do
            {
              echo "# Automated maintenance status"
              echo
              echo "This file is maintained automatically by GitHub Actions."
              echo
              echo "Run date: $(TZ=Asia/Kolkata date '+%Y-%m-%d')"
              echo "Commit: $i of $COUNT"
              echo "Updated: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST')"
              echo "Nonce: $RANDOM-$RANDOM"
            } > .github/activity-status.md

            git add .github/activity-status.md
            git commit -m "chore: maintenance update $i/$COUNT"
          done

          git push
