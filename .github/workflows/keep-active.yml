name: Scheduled Repository Maintenance

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-active.yml"
  schedule:
    # Three daily slots (IST): 09:13, 15:41, 21:23
    - cron: "43 3 * * *"
    - cron: "11 10 * * *"
    - cron: "53 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-repository-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create today's scheduled commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          git config user.name "yashsing0224234-max"
          git config user.email "232315740+yashsing0224234-max@users.noreply.github.com"

          git pull --rebase origin main

          mkdir -p .github
          STATE_FILE=".github/activity-state.txt"
          STATUS_FILE=".github/activity-status.md"

          DATE=$(TZ=Asia/Kolkata date '+%Y-%m-%d')
          HOUR=$(TZ=Asia/Kolkata date '+%H')
          HASH=$(printf '%s' "$DATE" | cksum | awk '{print $1}')

          # Stable daily target: 8..12 total commits.
          TARGET=$((8 + HASH % 5))

          # Split today's target across the three slots.
          A=$(((TARGET + 2) / 3))
          B=$((TARGET / 3))
          C=$((TARGET - A - B))

          # Rotate the split by date so slot sizes vary.
          ROT=$((HASH % 3))
          if [ "$ROT" -eq 0 ]; then
            MORNING=$A; AFTERNOON=$B; EVENING=$C
          elif [ "$ROT" -eq 1 ]; then
            MORNING=$B; AFTERNOON=$C; EVENING=$A
          else
            MORNING=$C; AFTERNOON=$A; EVENING=$B
          fi

          # For scheduled runs (including reruns), use the original cron
          # expression so a rerun cannot accidentally become a different slot.
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_EXPR" in
              "43 3 * * *")
                SLOT="morning"
                COUNT=$MORNING
                ;;
              "11 10 * * *")
                SLOT="afternoon"
                COUNT=$AFTERNOON
                ;;
              "53 15 * * *")
                SLOT="evening"
                COUNT=$EVENING
                ;;
              *)
                echo "Unknown schedule expression: $SCHEDULE_EXPR"
                exit 1
                ;;
            esac
          else
            # Manual runs choose the current IST slot.
            if [ "$HOUR" -lt 13 ]; then
              SLOT="morning"
              COUNT=$MORNING
            elif [ "$HOUR" -lt 19 ]; then
              SLOT="afternoon"
              COUNT=$AFTERNOON
            else
              SLOT="evening"
              COUNT=$EVENING
            fi
          fi

          MARKER="$DATE $SLOT"
          touch "$STATE_FILE"

          if grep -Fxq "$MARKER" "$STATE_FILE"; then
            echo "$SLOT slot already completed for $DATE. Nothing to do."
            exit 0
          fi

          echo "Date: $DATE"
          echo "Daily target: $TARGET commits"
          echo "Slot: $SLOT"
          echo "This slot: $COUNT commits"

          for i in $(seq 1 "$COUNT"); do
            {
              echo "# Automated maintenance status"
              echo
              echo "This file is maintained automatically by GitHub Actions."
              echo
              echo "Date: $DATE"
              echo "Daily target: $TARGET"
              echo "Slot: $SLOT"
              echo "Slot commit: $i of $COUNT"
              echo "Updated: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST')"
              echo "Nonce: $RANDOM-$RANDOM"
            } > "$STATUS_FILE"

            if [ "$i" -eq 1 ]; then
              echo "$MARKER" >> "$STATE_FILE"
              git add "$STATE_FILE"
            fi

            git add "$STATUS_FILE"
            git commit -m "chore: $SLOT maintenance $i/$COUNT"
          done

          git push origin main
